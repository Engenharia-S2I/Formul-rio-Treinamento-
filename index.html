<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Avaliação do Treinamento - S2i Distribuição Industrial</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
      color: #222;
      line-height: 1.6;
      padding: 20px;
    }
    .container {
      max-width: 620px;
      margin: 30px auto;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      border: 1px solid #eee;
    }
    .header {
      background: linear-gradient(135deg, #FFD700, #FFC107);
      color: #000;
      text-align: center;
      padding: 40px 20px;
    }
    .header img {
      width: 100px;
      margin-bottom: 15px;
    }
    .form-container {
      padding: 40px 30px;
      background: #ffffff;
    }
    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #090701;
      font-size: 1rem;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
      color: #333;
      font-size: 1rem;
      transition: all 0.3s;
    }
    input:focus,
    textarea:focus {
      outline: none;
      border-color: #FFD700;
      box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }
    .checkbox-group input {
      width: auto;
      accent-color: #FFD700;
    }
    button {
      background: linear-gradient(to right, #FFD700, #FFC107);
      color: #000;
      border: none;
      padding: 18px;
      font-size: 1.15rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s;
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.35);
    }
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5);
    }
    .social-buttons {
      margin: 20px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
    }
    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: transparent;
      color: #222;
      border: 2px solid #FFD700;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .social-btn:hover {
      background: linear-gradient(to right, #FFD700, #FFC107);
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 215, 0, 0.4);
      border-color: transparent;
    }
    .social-btn i {
      font-size: 1.4rem;
    }
    
    .msg {
      margin-top: 25px;
      padding: 18px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      font-size: 1.05rem;
    }
    .loading { background: #fffbeb; color: #92400e; border: 1px solid #fde047; }
    .success { background: #ecfdf5; color: #065f46; border: 1px solid #6ee7b7; }
    .error   { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
    .hidden { display: none; }
    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 0.9rem;
      border-top: 1px solid #eee;
      background: #fafafa;
    }
    @media (max-width: 600px) {
      .container { margin: 15px; }
      .form-container { padding: 30px 20px; }
      .social-buttons { flex-direction: column; gap: 12px; }
      .social-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <img src="https://github.com/Engenharia-S2I/Formul-rio-Treinamento-/blob/main/LOGO%2003.png?raw=true" />
      <h1>Avaliação do Treinamento</h1>
      <p>Sua opinião nos ajuda a melhorar!</p>
    </header>

    <div class="form-container">
      <form id="form">

        <div class="form-group">
          <label for="empresa">Nome da empresa *</label>
          <input type="text" id="empresa" name="empresa" required />
        </div>

        <div class="form-group">
          <label for="setor">Setor que trabalha *</label>
          <input type="text" id="setor" name="setor" required placeholder="Ex: Manutenção, Automação, Produção..." />
        </div>

        <div class="form-group">
          <label for="whatsapp">WhatsApp (com DDD) *</label>
          <input type="tel" id="whatsapp" name="whatsapp" required placeholder="(62) 99999-9999" />
        </div>

        <div class="form-group">
          <label for="email">E-mail *</label>
          <input type="email" id="email" name="email" required placeholder="seuemail@empresa.com" />
        </div>

        <div class="form-group">
          <div class="checkbox-group">
            <input type="checkbox" id="atualizacoes" name="atualizacoes" />
            <label for="atualizacoes">Desejo receber atualizações técnicas periódicas da S2i</label>
          </div>
        </div>

        <div class="form-group">
          <p style="margin-bottom: 16px; color: #555; font-weight: 500; text-align: center; font-size: 1.05rem;">
            Conecte-se com a S2i:
          </p>
          <div class="social-buttons">
            <a href="https://wa.me/556231420595" target="_blank" rel="noopener noreferrer" class="social-btn whatsapp">
              <i class="fab fa-whatsapp"></i> WhatsApp
            </a>
            <a href="https://www.instagram.com/s2idistribuicaoindustrial" target="_blank" rel="noopener noreferrer" class="social-btn instagram">
              <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="https://www.linkedin.com/company/s2i-distribui%C3%A7%C3%A3o-industrial" target="_blank" rel="noopener noreferrer" class="social-btn linkedin">
              <i class="fab fa-linkedin-in"></i> LinkedIn
            </a>
            <a href="https://www.youtube.com/@s2idistribuicaoindustrial" target="_blank" rel="noopener noreferrer" class="social-btn youtube">
              <i class="fab fa-youtube"></i> YouTube
            </a>
          </div>
        </div>

        <!-- Campo de nota normal (substituiu as estrelas) -->
        <div class="form-group">
          <label for="nota">Avaliação do treinamento (0 a 10) *</label>
          <input type="number" id="nota" name="nota" min="0" max="10" step="1" required placeholder="Ex: 8" />
        </div>

        <!-- Comentário agora obrigatório -->
        <div class="form-group">
          <label for="melhorias">O que você mais gostou no treinamento e o que acredita que pode ser melhorado? *</label>
          <textarea id="melhorias" name="melhorias" rows="5" required placeholder="Deixe aqui suas sugestões, críticas construtivas ou comentários..."></textarea>
        </div>

        <button type="submit">Enviar Avaliação</button>
      </form>

      <div id="loading" class="msg loading hidden">Enviando avaliação...</div>
      <div id="success" class="msg success hidden">
        Obrigado! Avaliação enviada com sucesso.<br>
        <small>Enviamos um e-mail de agradecimento para você.</small>
      </div>
      <div id="error" class="msg error hidden"></div>
    </div>

    <footer>© 2026 S2i Distribuição Industrial • Soluções em Automação Industrial</footer>
  </div>

<script>
  const form = document.getElementById('form');
  const loading = document.getElementById('loading');
  const success = document.getElementById('success');
  const errorMsg = document.getElementById('error');

  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxoC9UIic1PykrLj4MzYiCLX_cOKtolpaqLfiW-JKp5L9-dguhfxpVFvhgXF1Fv6I3Zlw/exec';

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    [loading, success, errorMsg].forEach(el => el.classList.add('hidden'));
    loading.classList.remove('hidden');
    errorMsg.textContent = '';

    const formData = new FormData(form);

    // Log para debug
    console.log('Dados enviados:', Object.fromEntries(formData));

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: formData
      });

      const result = await response.text();
      console.log('Resposta do servidor:', result);

      if (result.trim() === 'Sucesso') {
        loading.classList.add('hidden');
        success.classList.remove('hidden');
        form.reset();
      } else {
        throw new Error('Resposta do servidor: ' + result);
      }
    } catch (err) {
      console.error('Erro completo:', err);
      loading.classList.add('hidden');
      errorMsg.classList.remove('hidden');
      errorMsg.textContent = 'Erro ao enviar';
    }
  });
</script>
</body>
</html>
